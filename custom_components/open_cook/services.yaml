item_event:
  name: Item event
  description: Record an event on one probe's own timeline (on/wrapped/sauce/flip/done).
  fields:
    probe_id: { name: Probe id, required: true, selector: { text: } }
    event: { name: Event key, description: "on, wrapped, sauce, flip, done, or custom.", required: true, selector: { text: } }
    label: { name: Label, selector: { text: } }

note:
  name: Grill note
  description: Add a grill-level note to the shared timeline.
  fields:
    label: { name: Label, default: Note, selector: { text: } }
    color: { name: Color, selector: { text: } }

reset_item:
  name: Reset item
  description: Clear one probe's timeline and start time.
  fields:
    probe_id: { name: Probe id, required: true, selector: { text: } }

edit_event:
  name: Edit event
  description: Change the time or label of any logged event (item or note).
  fields:
    id: { name: Event id, required: true, selector: { text: } }
    timestamp: { name: Timestamp, description: New unix time (seconds)., selector: { number: { min: 0, max: 9999999999, mode: box } } }
    label: { name: Label, selector: { text: } }
    color: { name: Color, selector: { text: } }

delete_event:
  name: Delete event
  fields:
    id: { name: Event id, required: true, selector: { text: } }

reset:
  name: Reset cook
  description: Clear all items' timelines and grill notes.

set_target:
  name: Set first probe target
  fields:
    target: { name: Target, required: true, selector: { number: { min: 0, max: 600, mode: box } } }

set_grill_entity:
  name: Set grill sensor
  description: Choose (or clear) the grill temperature sensor without reconfiguring the integration.
  fields:
    entity: { name: Grill sensor, description: Leave blank to clear., selector: { entity: { domain: sensor, device_class: temperature } } }

set_grill_target:
  name: Set grill target
  description: Grill hold temperature; alerts if it drifts beyond the band while cooking.
  fields:
    target: { name: Target, selector: { number: { min: 0, max: 800, mode: box } } }
    band: { name: Band, selector: { number: { min: 1, max: 200, mode: box } } }

add_probe:
  name: Add probe
  fields:
    name: { name: Name, selector: { text: } }
    readings: { name: Reading entities, selector: { entity: { multiple: true, domain: sensor, device_class: temperature } } }
    item: { name: Item preset, selector: { text: } }
    target: { name: Target, selector: { number: { min: 0, max: 600, mode: box } } }

update_probe:
  name: Update probe
  fields:
    id: { name: Probe id, required: true, selector: { text: } }
    name: { name: Name, selector: { text: } }
    item: { name: Item preset, selector: { text: } }
    target: { name: Target, selector: { number: { min: 0, max: 600, mode: box } } }
    readings: { name: Reading entities, selector: { entity: { multiple: true, domain: sensor, device_class: temperature } } }

remove_probe:
  name: Remove probe
  fields:
    id: { name: Probe id, required: true, selector: { text: } }
