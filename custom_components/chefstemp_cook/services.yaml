mark_event:
  name: Mark event
  description: Record a cook event (shown as a marker on the heat chart).
  fields:
    event: { name: Event key, description: "meat_on, wrapped, sauce, flip, done, or custom.", default: custom, selector: { text: } }
    label: { name: Label, description: Free-text label for a custom note., selector: { text: } }
    color: { name: Color, description: Optional hex color., selector: { text: } }

edit_event:
  name: Edit event
  description: Change the time or label of a logged event.
  fields:
    id: { name: Event id, description: The event's id (from the app)., required: true, selector: { text: } }
    timestamp: { name: Timestamp, description: New unix time (seconds)., selector: { number: { min: 0, max: 9999999999, mode: box } } }
    label: { name: Label, selector: { text: } }
    color: { name: Color, selector: { text: } }

delete_event:
  name: Delete event
  fields:
    id: { name: Event id, required: true, selector: { text: } }

reset:
  name: Reset cook
  description: Clear the current cook's events and timers.

set_target:
  name: Set first probe target
  fields:
    target: { name: Target, required: true, selector: { number: { min: 0, max: 600, mode: box } } }

set_grill_target:
  name: Set grill target
  description: Grill hold temperature; alerts if it drifts beyond the band.
  fields:
    target: { name: Target, description: Grill target (blank to clear)., selector: { number: { min: 0, max: 800, mode: box } } }
    band: { name: Band, description: Allowed +/- drift before alerting., selector: { number: { min: 1, max: 200, mode: box } } }

add_probe:
  name: Add probe
  fields:
    name: { name: Name, selector: { text: } }
    readings: { name: Reading entities, description: One or more temperature sensors., selector: { entity: { multiple: true, domain: sensor, device_class: temperature } } }
    item: { name: Item preset, selector: { text: } }
    target: { name: Target, selector: { number: { min: 0, max: 600, mode: box } } }

update_probe:
  name: Update probe
  fields:
    id: { name: Probe id, required: true, selector: { text: } }
    name: { name: Name, selector: { text: } }
    item: { name: Item preset, selector: { text: } }
    target: { name: Target, selector: { number: { min: 0, max: 600, mode: box } } }
    readings: { name: Reading entities, selector: { entity: { multiple: true, domain: sensor, device_class: temperature } } }

remove_probe:
  name: Remove probe
  fields:
    id: { name: Probe id, required: true, selector: { text: } }
